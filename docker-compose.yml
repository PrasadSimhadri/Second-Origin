version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
    restart: always

  customer:
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - PORT=3002
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
    depends_on:
      - backend
    restart: always

  guard:
    build:
      context: .
      dockerfile: apps/guard/Dockerfile
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      - PORT=3003
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
    depends_on:
      - backend
    restart: always

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    ports:
      - "3004:3004"
    env_file:
      - .env
    environment:
      - PORT=3004
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
    depends_on:
      - backend
    restart: always
